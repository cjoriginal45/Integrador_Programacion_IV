<div class="page-container">
  <div class="page-header">
    <h2>Gestión de Estudiantes</h2>
    <button class="btn-primary" (click)="toggleForm()">{{ showForm ? 'Cerrar' : '+ Nuevo Estudiante' }}</button>
  </div>

  <!-- Formulario de Estudiante -->
  @if (showForm) {
    <div class="form-card">
      <h3>{{ editingId ? 'Editar' : 'Nuevo' }} Estudiante</h3>
      <form (submit)="saveEstudiante()">
        <div class="form-row">
          <div class="form-group">
            <label>Documento (DNI/CUIL)</label>
            <input type="text" [(ngModel)]="model.documento" name="documento" required>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" [(ngModel)]="model.email" name="email">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Apellido</label>
            <input type="text" [(ngModel)]="model.apellido" name="apellido" required>
          </div>
          <div class="form-group">
            <label>Nombres</label>
            <input type="text" [(ngModel)]="model.nombres" name="nombres" required>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-save">Guardar Cambios</button>
          <button type="button" class="btn-cancel" (click)="cancelEdit()">Cancelar</button>
        </div>
      </form>
    </div>
  }

  <!-- Buscador -->
  <div class="search-bar">
    <input type="text" placeholder="Buscar por apellido, nombre o documento..." [(ngModel)]="searchTerm" (input)="loadEstudiantes()">
  </div>

  <!-- Tabla -->
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Documento</th>
          <th>Apellido y Nombre</th>
          <th>Email</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        @for (e of estudiantes; track e.id_estudiante) {
          <tr>
            <td>{{ e.documento }}</td>
            <td>{{ e.apellido }}, {{ e.nombres }}</td>
            <td>{{ e.email }}</td>
            <td>
              <button class="btn-icon" (click)="editEstudiante(e)" title="Editar">✏️</button>
              <button class="btn-icon delete" (click)="deleteEstudiante(e.id_estudiante)" title="Eliminar">🗑️</button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="4" class="empty-msg">No se encontraron estudiantes</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
