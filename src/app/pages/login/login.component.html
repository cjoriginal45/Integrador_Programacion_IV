<div class="login-container">
  <div class="login-card">
    <div class="left-panel">
      <div class="left-content">
        <h1>UNER</h1>
        <p>Facultad de Ciencias de la Administración</p>
      </div>
    </div>

    <div class="right-panel">
      <h2>Iniciar sesión</h2>
      <form (submit)="onLogin($event)">
        <div class="form-group">
          <input type="text" [(ngModel)]="username" name="username" placeholder="Nombre de usuario" required>
        </div>
        <div class="form-group">
          <input type="password" [(ngModel)]="password" name="password" placeholder="Contraseña" required>
        </div>
        
        @if (error) {
          <p class="error-msg">{{ error }}</p>
        }
        
        <div class="actions">
          <button type="submit" [disabled]="loading">
            {{ loading ? 'Ingresando...' : 'Acceder' }}
          </button>
        </div>
      </form>
      <a href="#" class="forgot">¿Olvidaste tu contraseña?</a>
    </div>
  </div>
</div>
